name: Build and Release Javadsolvpn

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Pinned libv2ray Core AAR is Present
        run: |
          mkdir -p app/libs
          if [ ! -f "app/libs/libv2ray.aar" ] || [ $(stat -c%s "app/libs/libv2ray.aar") -lt 10000000 ]; then
            echo "Downloading pinned AndroidLibXrayLite v26.10.21..."
            curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.21/libv2ray.aar
          fi

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK and Bundle
        run: |
          gradle :app:assembleDebug :app:bundleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: javadsolvpn-android-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: javadsolvpn-android-aab
          path: app/build/outputs/bundle/debug/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: "Javadsolvpn v1.0.${{ github.run_number }}"
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
